# Nginx reverse proxy — place in /etc/nginx/sites-available/
# Replace YOUR_DOMAIN with your domain or use _ for IP-only HTTP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Allow API media proxy uploads (up to 25 MB) and large request headers.
    client_max_body_size 25m;
    client_body_timeout 300s;

    # Let's Encrypt challenge (certbot adds SSL block automatically)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 86400s;
    }
}
